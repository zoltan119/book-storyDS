name: build-debug-apk

# Trigger on every push and allow manual runs from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Use the project's bundled Gradle wrapper. setup-gradle handles caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Show what tasks exist before trying to build, so if the build name we
      # guess is wrong, the log tells us what's actually available.
      - name: List available assemble tasks
        run: ./gradlew tasks --group=build --all || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-storyds-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
